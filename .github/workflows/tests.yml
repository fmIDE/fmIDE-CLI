name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error::DeprecationWarning -m unittest discover -v
      - run: python -m pip install build
      - run: python -m build
      - shell: bash
        run: python -m pip install dist/*.whl
      - run: fmide server --help
      - run: fmide --version
      - run: fmIDE -file fmIDE --dry-run
